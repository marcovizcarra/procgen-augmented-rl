name: procgen-augmented-rl
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip=24.0
  # ------------------------------------------------------------
  # uncomment if you want to use Apple Silicon compatible version
  # - setuptools<58
  # - numpy<2
  # ------------------------------------------------------------
  - numpy 
  - pandas
  - matplotlib
  - pytorch>=2.1
  - torchvision
  - pip:
      # Offline dataset + offline RL objectives
      - torchrl
      - tensordict

      # Procgen evaluation (Gym wrapper) is installed in setup_env.sh. 
      - gym==0.21.0 # comment out if you want to use Apple Silicon compatible version
      - procgen==0.10.7

      # Utilities
      - requests
      - tqdm
