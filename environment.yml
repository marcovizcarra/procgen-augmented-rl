name: procgen-augmented-rl
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip=24.0
  - numpy
  - pandas
  - matplotlib
  - pytorch>=2.1
  - torchvision
  - pip:
      # Offline dataset + offline RL objectives
      - torchrl
      - tensordict

      # Procgen evaluation (Gym wrapper)
      - gym==0.21.0
      - procgen==0.10.7

      # Utilities
      - requests
      - tqdm
