name: procgen-augmented-rl
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip=24.0
  - setuptools<58
  - numpy<2
  - pandas
  - matplotlib
  - pytorch>=2.1
  - torchvision
  - pip:
      # Offline dataset + offline RL objectives
      - torchrl
      - tensordict

      # Procgen evaluation (Gym wrapper) is installed in setup_env.sh.
      # gym==0.21.0 is legacy and needs older packaging tooling to build.
      - procgen==0.10.7

      # Utilities
      - requests
      - tqdm
